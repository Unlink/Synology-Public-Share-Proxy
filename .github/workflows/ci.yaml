name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet test tests/ShareProxy.Tests/ShareProxy.Tests.csproj -c Release --nologo
      - run: node --check src/ShareProxy/wwwroot/app.js
      - run: python3 tests/http_smoke.py
      - run: docker build -t share-proxy-ci .
