# Equivalent reverse proxy configuration for nginx you control.
# DSM's managed nginx configuration may be overwritten; do not patch DSM system files.
# Supply your own ssl_certificate and ssl_certificate_key in the enclosing TLS server.
location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 1g;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    # URLs contain bearer share tokens. Disable access logging for this virtual host.
    access_log off;
    # Error logs can contain request URLs; retain them only in a protected local destination.
    error_log /dev/null crit;
}
